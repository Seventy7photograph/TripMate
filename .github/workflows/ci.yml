name: ci

on:
  push:
    branches: ["main", "master", "codex/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: tripmate
          POSTGRES_USER: tripmate
          POSTGRES_PASSWORD: tripmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripmate -d tripmate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_ENV: test
      PROVIDER_PROFILE: mock
      DATABASE_URL: postgresql+asyncpg://tripmate:tripmate@127.0.0.1:5432/tripmate
      REDIS_URL: redis://127.0.0.1:6379/0
      HEALTH_CHECK_TIMEOUT_SECONDS: 3
      JWT_SECRET: ci-only-test-secret-with-at-least-32-characters
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --project apps/api --locked

      - name: Apply database migrations
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Verify PostgreSQL and Redis probes
        working-directory: apps/api
        run: >-
          uv run python -c
          "import asyncio; from app.core.config import Settings; from app.services.health import InfrastructureHealthService; report = asyncio.run(InfrastructureHealthService(Settings()).check()); assert report.healthy, report"

      - name: Verify
        run: pnpm verify

      - name: Critical and security gates
        run: |
          uv run --project apps/api pytest apps/api/tests/critical apps/api/tests/security -q

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Backup and restore drill
        env:
          PGPASSWORD: tripmate
        run: |
          pg_dump -h 127.0.0.1 -U tripmate -d tripmate -Fc -f /tmp/tripmate-ci.dump
          createdb -h 127.0.0.1 -U tripmate tripmate_restore_check
          pg_restore -h 127.0.0.1 -U tripmate -d tripmate_restore_check --no-owner --no-privileges --exit-on-error /tmp/tripmate-ci.dump
          SOURCE_COUNTS=$(psql -h 127.0.0.1 -U tripmate -d tripmate -tA -c "SELECT count(*) FROM users"):$(psql -h 127.0.0.1 -U tripmate -d tripmate -tA -c "SELECT count(*) FROM trips")
          RESTORED_COUNTS=$(psql -h 127.0.0.1 -U tripmate -d tripmate_restore_check -tA -c "SELECT count(*) FROM users"):$(psql -h 127.0.0.1 -U tripmate -d tripmate_restore_check -tA -c "SELECT count(*) FROM trips")
          test "$SOURCE_COUNTS" = "$RESTORED_COUNTS"
          dropdb -h 127.0.0.1 -U tripmate tripmate_restore_check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke test
        run: pnpm e2e

      - name: Start API for performance
        env:
          PROVIDER_PROFILE: mock
          MAP_PROVIDER_PROFILE: mock
          PLANNING_WORKER_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
        run: |
          apps/api/.venv/bin/uvicorn app.main:app --app-dir apps/api --host 127.0.0.1 --port 8010 &
          echo $! > "$RUNNER_TEMP/tripmate-performance-api.pid"
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8010/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Performance smoke
        run: >-
          uv run --project apps/api python tests/performance/trip_crud.py
          --base-url http://127.0.0.1:8010/api/v1
          --vus 3
          --duration 5
          --output output/performance/ci.json

      - name: Stop API for performance
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/tripmate-performance-api.pid" ]; then
            API_PID=$(cat "$RUNNER_TEMP/tripmate-performance-api.pid")
            kill "$API_PID" 2>/dev/null || true
            for attempt in $(seq 1 10); do
              if ! kill -0 "$API_PID" 2>/dev/null; then
                exit 0
              fi
              sleep 1
            done
            echo "Performance API process did not stop."
            exit 1
          fi

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose application profile
        run: docker compose --profile app config --quiet

      - name: Build and start deployment profile
        run: docker compose --profile app up -d --build --wait

      - name: Verify deployed endpoints
        run: |
          curl --fail --silent http://127.0.0.1:8000/api/v1/health
          curl --fail --silent http://127.0.0.1:8080 >/dev/null
          curl --fail --silent http://127.0.0.1:8081 >/dev/null

      - name: Verify ClamAV blocks EICAR
        run: |
          EMAIL="clamav-smoke-${GITHUB_RUN_ID}@example.com"
          RESPONSE=$(curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"correct-horse-battery-staple\",\"display_name\":\"ClamAV Smoke\"}")
          TOKEN=$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          printf 'X5O!P%%@AP[4\\PZX54(P^)7CC)7}$EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > /tmp/eicar.txt
          for attempt in $(seq 1 60); do
            STATUS=$(curl --silent --output /tmp/eicar-response.json --write-out '%{http_code}' \
              -X POST http://127.0.0.1:8000/api/v1/uploads \
              -H "Authorization: Bearer $TOKEN" \
              -F 'file=@/tmp/eicar.txt;type=text/plain')
            if [ "$STATUS" = "422" ]; then
              grep --quiet 'malware_detected' /tmp/eicar-response.json
              exit 0
            fi
            if [ "$STATUS" != "503" ]; then
              cat /tmp/eicar-response.json
              exit 1
            fi
            sleep 2
          done
          cat /tmp/eicar-response.json
          exit 1

      - name: Stop deployment profile
        if: always()
        run: docker compose --profile app down -v
