name: safety-briefing
version: 1.0.0
status: active
description: Build evidence-backed travel safety reminders without diagnosis.
input_schema:
  type: object
  properties:
    dates:
      type: array
      items:
        type: string
    party:
      type: array
      items:
        type: string
    altitude_m:
      type: [number, "null"]
    city:
      type: [string, "null"]
  required: [dates]
  additionalProperties: false
output_schema:
  type: object
  properties:
    level:
      type: string
      enum: [low, moderate, warning, high]
    reminders:
      type: array
      items:
        type: string
    evidence_ids:
      type: array
      items:
        type: string
  required: [level, reminders, evidence_ids]
  additionalProperties: false
allowed_tools:
  - get_weather
  - get_altitude
  - get_route
allowed_mcp_connectors: []
max_tool_calls: 6
timeout_seconds: 45
max_tokens: 4000
requires_evidence: true
fallback: existing_itinerary_graph
