name: travel-memory
version: 1.0.0
status: active
description: Read only explicitly authorized travel memory for planning context.
input_schema:
  type: object
  properties:
    query:
      type: string
    limit:
      type: integer
      minimum: 1
      maximum: 20
  required: [query]
  additionalProperties: false
output_schema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
    applied_count:
      type: integer
    degraded:
      type: boolean
    write_performed:
      type: boolean
  required: [items, applied_count, degraded, write_performed]
  additionalProperties: false
allowed_tools:
  - get_authorized_memory_context
allowed_mcp_connectors: []
max_tool_calls: 2
timeout_seconds: 8
max_tokens: 2000
fallback: existing_itinerary_graph
