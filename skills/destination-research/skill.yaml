name: destination-research
version: 1.0.0
status: active
description: Research a destination and return provider-backed place candidates.
input_schema:
  type: object
  properties:
    query:
      type: string
    city:
      type: [string, "null"]
    types:
      type: [string, "null"]
    limit:
      type: integer
      minimum: 1
      maximum: 20
  required: [query]
  additionalProperties: false
output_schema:
  type: object
  properties:
    places:
      type: array
      items:
        type: object
    searched_at:
      type: string
  required: [places, searched_at]
  additionalProperties: false
allowed_tools:
  - search_places
allowed_mcp_connectors: []
max_tool_calls: 4
timeout_seconds: 30
max_tokens: 4000
fallback: existing_itinerary_graph
