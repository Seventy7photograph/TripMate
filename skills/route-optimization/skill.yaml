name: route-optimization
version: 1.0.0
status: active
description: Calculate provider-backed routes for ordered travel stops.
input_schema:
  type: object
  properties:
    origin:
      type: object
    destination:
      type: object
    mode:
      type: string
      enum: [driving, walking, bicycling, bus, subway, flight]
    city:
      type: [string, "null"]
  required: [origin, destination, mode]
  additionalProperties: false
output_schema:
  type: object
  properties:
    distance_m:
      type: integer
    duration_s:
      type: integer
    polyline:
      type: [string, "null"]
    source:
      type: object
  required: [distance_m, duration_s, source]
  additionalProperties: false
allowed_tools:
  - get_route
allowed_mcp_connectors: []
max_tool_calls: 8
timeout_seconds: 40
max_tokens: 3000
fallback: existing_itinerary_graph
