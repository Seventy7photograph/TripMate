name: weather-and-clothing
version: 1.0.0
status: active
description: Build evidence-backed weather, clothing, and outdoor risk guidance.
input_schema:
  type: object
  properties:
    city:
      type: string
    date:
      type: string
  required: [city, date]
  additionalProperties: false
output_schema:
  type: object
  properties:
    clothing_advice:
      type: array
      items:
        type: string
    evidence_ids:
      type: array
      items:
        type: string
  required: [clothing_advice, evidence_ids]
  additionalProperties: false
allowed_tools:
  - get_weather
allowed_mcp_connectors: []
max_tool_calls: 2
timeout_seconds: 25
max_tokens: 3000
requires_evidence: true
fallback: existing_itinerary_graph
