name: food-planning
version: 1.0.0
status: active
description: Plan meals with provider-backed places and place facts.
input_schema:
  type: object
  properties:
    meal:
      type: string
      enum: [breakfast, lunch, dinner]
    city:
      type: string
    dietary:
      type: array
      items:
        type: string
    limit:
      type: integer
      minimum: 1
      maximum: 3
  required: [meal, city]
  additionalProperties: false
output_schema:
  type: object
  properties:
    meals:
      type: array
      items:
        type: object
    evidence_ids:
      type: array
      items:
        type: string
  required: [meals, evidence_ids]
  additionalProperties: false
allowed_tools:
  - search_places
  - get_place_facts
allowed_mcp_connectors: []
max_tool_calls: 8
timeout_seconds: 45
max_tokens: 5000
requires_evidence: true
fallback: existing_itinerary_graph
