name: tripmate

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tripmate}
      POSTGRES_USER: ${POSTGRES_USER:-tripmate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tripmate}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tripmate} -d ${POSTGRES_DB:-tripmate}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  clamav:
    profiles: ["app"]
    image: clamav/clamav:stable
    environment:
      CLAMAV_NO_MILTERD: "true"
    volumes:
      - clamav_data:/var/lib/clamav
    restart: unless-stopped

  mcp-amap:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command:
      [
        "python",
        "-m",
        "app.mcp.server",
        "--connector",
        "amap",
        "--host",
        "0.0.0.0",
        "--port",
        "8021",
      ]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PROVIDER_PROFILE: ${PROVIDER_PROFILE:-mock}
      MAP_PROVIDER_PROFILE: ${MAP_PROVIDER_PROFILE:-mock}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      AMAP_BASE_URL: ${AMAP_BASE_URL:-https://restapi.amap.com}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-5}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
    restart: unless-stopped

  mcp-weather:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command:
      [
        "python",
        "-m",
        "app.mcp.server",
        "--connector",
        "weather",
        "--host",
        "0.0.0.0",
        "--port",
        "8022",
      ]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PROVIDER_PROFILE: ${PROVIDER_PROFILE:-mock}
      MAP_PROVIDER_PROFILE: ${MAP_PROVIDER_PROFILE:-mock}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      AMAP_BASE_URL: ${AMAP_BASE_URL:-https://restapi.amap.com}
      OPEN_METEO_BASE_URL: ${OPEN_METEO_BASE_URL:-https://api.open-meteo.com}
      OPEN_METEO_GEOCODING_BASE_URL: ${OPEN_METEO_GEOCODING_BASE_URL:-https://geocoding-api.open-meteo.com}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-5}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-2}
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
    restart: unless-stopped

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tripmate}:${POSTGRES_PASSWORD:-tripmate}@postgres:5432/${POSTGRES_DB:-tripmate}
      REDIS_URL: redis://redis:6379/0
      PROVIDER_PROFILE: ${PROVIDER_PROFILE:-mock}
      MAP_PROVIDER_PROFILE: ${MAP_PROVIDER_PROFILE:-mock}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-}
      MCP_GATEWAY_ENABLED: ${MCP_GATEWAY_ENABLED:-false}
      MCP_ALLOWED_CONNECTORS: ${MCP_ALLOWED_CONNECTORS:-amap,weather}
      MCP_AMAP_ENDPOINT: ${MCP_AMAP_ENDPOINT:-http://mcp-amap:8021/mcp}
      MCP_WEATHER_ENDPOINT: ${MCP_WEATHER_ENDPOINT:-http://mcp-weather:8022/mcp}
      JWT_SECRET: ${JWT_SECRET:-tripmate-development-only-change-before-production}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      PLANNING_WORKER_ENABLED: "false"
      UPLOAD_DIR: /app/output/uploads
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - upload_data:/app/output/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-amap:
        condition: service_started
      mcp-weather:
        condition: service_started
      clamav:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 15s
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["python", "-m", "app.workers.planning_worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tripmate}:${POSTGRES_PASSWORD:-tripmate}@postgres:5432/${POSTGRES_DB:-tripmate}
      REDIS_URL: redis://redis:6379/0
      PROVIDER_PROFILE: ${PROVIDER_PROFILE:-mock}
      MAP_PROVIDER_PROFILE: ${MAP_PROVIDER_PROFILE:-mock}
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-}
      MCP_GATEWAY_ENABLED: ${MCP_GATEWAY_ENABLED:-false}
      MCP_ALLOWED_CONNECTORS: ${MCP_ALLOWED_CONNECTORS:-amap,weather}
      MCP_AMAP_ENDPOINT: ${MCP_AMAP_ENDPOINT:-http://mcp-amap:8021/mcp}
      MCP_WEATHER_ENDPOINT: ${MCP_WEATHER_ENDPOINT:-http://mcp-weather:8022/mcp}
      JWT_SECRET: ${JWT_SECRET:-tripmate-development-only-change-before-production}
      MODEL_CONFIG_ENCRYPTION_KEY: ${MODEL_CONFIG_ENCRYPTION_KEY:-}
      OUTBOUND_PROXY_URL: ${OUTBOUND_PROXY_URL:-}
      UPLOAD_DIR: /app/output/uploads
    volumes:
      - upload_data:/app/output/uploads
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/admin.Dockerfile
    ports:
      - "${ADMIN_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  upload_data:
  clamav_data:

