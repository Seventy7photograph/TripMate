[project]
name = "tripmate-api"
version = "1.1.0"
description = "TripMate FastAPI backend"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.18.0",
    "asyncpg>=0.30.0",
    "cryptography>=45.0.0,<47.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.121.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "PyJWT>=2.10.1",
    "pydantic-settings>=2.12.0",
    "jsonschema>=4.26.0",
    "Pillow>=11.3.0,<13.0.0",
    "pypdf>=5.9.0,<7.0.0",
    "python-multipart>=0.0.20,<0.1.0",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.38.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-postgres>=3.0.0,<4.0.0",
    "pgvector>=0.4.2,<0.5.0",
    "psycopg[binary]>=3.2.0,<4.0.0",
    "pyyaml>=6.0.3",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.150.0",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.4",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
